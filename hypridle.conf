# =========================================================
# HYPRIDLE CONFIGURATION
# =========================================================
# Idle behavior: dim -> lock -> display off -> suspend.
# Locked with SUPER + SHIFT + L (see keybinds/session.lua)
# for manual lock outside idle timeouts.
# =========================================================

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Dim screen after 2 minutes of inactivity
listener {
    timeout = 120
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Lock after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off display after 5.5 minutes (just after lock)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 10 minutes
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
