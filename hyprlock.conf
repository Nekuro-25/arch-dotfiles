# =========================================================
# HYPRLOCK CONFIGURATION
# =========================================================
# Reuses the same wallpaper as hyprpaper for visual continuity.
# Palette: ice blue night (from the navy + periwinkle wallpaper).
# =========================================================

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/wallpaper.jpg
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(207, 222, 255, 0.95)
    font_size = 84
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(219, 230, 255, 0.75)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    rounding = 14
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(5d80e4ee) rgba(a8c4ffee) 45deg
    inner_color = rgba(141d4899)
    font_color = rgba(dbe6ffff)
    check_color = rgba(a8c4ffee) rgba(5d80e4ee) 45deg
    fail_color = rgba(f2829cff)
    capslock_color = rgba(e6c987ff)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL</i>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}
