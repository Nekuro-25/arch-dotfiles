# =========================================================
# HYPRLOCK CONFIGURATION
# =========================================================
# Reuses the same wallpaper as hyprpaper for visual continuity.
# Palette: dark red + ice blue (from the dragon wallpaper).
# =========================================================

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/wallpaper.jpg
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(143, 196, 220, 0.95)
    font_size = 84
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(201, 219, 230, 0.75)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    rounding = 14
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(e0122eee) rgba(8fc4dcee) 45deg
    inner_color = rgba(12060f99)
    font_color = rgba(c9dbe6ff)
    check_color = rgba(8fc4dcee) rgba(e0122eee) 45deg
    fail_color = rgba(ff3b55ff)
    capslock_color = rgba(c9a26bff)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL</i>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}
