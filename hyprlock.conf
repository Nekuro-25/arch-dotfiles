# =========================================================
# HYPRLOCK CONFIGURATION
# =========================================================
# Reuses the same wallpaper as hyprpaper for visual continuity.
# Cinematic minimalism: no widgets, no clock spam, just a
# blurred background, a clock, and a password field.
# =========================================================

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/wallpaper.jpg
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 0.9)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(255, 255, 255, 0.7)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 260, 55
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(255, 255, 255, 0.6)
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}
